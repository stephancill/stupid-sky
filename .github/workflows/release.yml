name: Release

# Push a tag like v0.1.1 to build the APKs and publish a GitHub release:
#   git tag v0.1.1 && git push origin v0.1.1
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build APKs
        run: ./gradlew assembleDebug --console=plain

      - name: Collect APKs
        run: |
          mkdir dist
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk dist/stupid-sky-arm64.apk
          cp app/build/outputs/apk/debug/app-universal-debug.apk dist/stupid-sky-universal.apk
          ls -la dist

      # Fixed file names, so releases/latest/download/stupid-sky-arm64.apk always points at the newest build.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk \
              --title "stupid sky ${TAG#v}" \
              --notes-file .github/release-notes.md \
              --generate-notes
          fi
